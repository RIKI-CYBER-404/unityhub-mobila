- name: Find and Build APK
        run: |
          # প্রথমে ZIP থাকলে extract করবে
          if [ -f "FC_SPORT_LIVE_TV_FIXED.zip" ]; then
            echo "ZIP পাওয়া গেছে, extract করছি..."
            unzip -o FC_SPORT_LIVE_TV_FIXED.zip
          fi

          # gradlew ফাইলটি কোথায় আছে তা খুঁজে বের করা
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found in the repository!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"

          # debug.keystore না থাকলে তৈরি করে দিবে
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore তৈরি করছি..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
