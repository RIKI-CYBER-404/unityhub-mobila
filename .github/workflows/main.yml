name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and Build APK
        run: |
          # প্রথমে ZIP থাকলে extract করবে
          if [ -f "FC_SPORT_LIVE_TV_FIXED.zip" ]; then
            echo "ZIP পাওয়া গেছে, extract করছি..."
            unzip -o FC_SPORT_LIVE_TV_FIXED.zip
          fi

          # gradlew ফাইলটি কোথায় আছে তা খুঁজে বের করা এবং পারমিশন ঠিক করা
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found in the repository!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FC-SPORT-LIVE-TV-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
